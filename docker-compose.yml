version: '3.8'

services:

  # --- MESSAGERIE (KAFKA) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: eeg-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: eeg-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- STOCKAGE METADONNEES (MONGODB) ---
  mongodb:
    image: mongo:6.0
    container_name: eeg-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo_data:/data/db

  # --- CACHE ET DONNÉES CRITIQUES (REDIS) ---
  redis:
    image: redis:7-alpine
    container_name: eeg-redis
    ports:
      - "6379:6379"

  # --- STOCKAGE D'OBJETS / ARCHIVAGE (MINIO) ---
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: eeg-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # --- BACKEND FASTAPI ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: eeg-backend
    depends_on:
      - kafka
      - mongodb
      - redis
      - minio
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URI: mongodb://root:rootpassword@mongodb:27017/
      MONGO_DATABASE: eeg_database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: eeg-data
      MINIO_SECURE: "false"
      ARCHIVE_AFTER_HOURS: 24

  # --- FRONTEND REACT ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eeg-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  # --- AGENT ACQUISITION ---
  acquisition:
    build:
      context: .
      dockerfile: agents/Dockerfile
    container_name: eeg-agent-acquisition
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: python -m agents.acquisition.agent

  # --- AGENT ANALYSE ---
  analysis:
    build:
      context: .
      dockerfile: agents/Dockerfile
    container_name: eeg-agent-analysis
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: python -m agents.analysis.agent

  # --- AGENT DECISION ---
  decision:
    build:
      context: .
      dockerfile: agents/Dockerfile
    container_name: eeg-agent-decision
    depends_on:
      - kafka
      - mongodb
      - redis
      - minio
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URI: mongodb://root:rootpassword@mongodb:27017/
      MONGO_DATABASE: eeg_database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: eeg-data
      MINIO_SECURE: "false"
    command: python -m agents.decision.agent

  # --- AGENT ARCHIVAGE ---
  archival:
    build:
      context: .
      dockerfile: agents/Dockerfile
    container_name: eeg-agent-archival
    depends_on:
      - mongodb
      - minio
    environment:
      MONGO_URI: mongodb://root:rootpassword@mongodb:27017/
      MONGO_DATABASE: eeg_database
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: eeg-data
      MINIO_SECURE: "false"
      ARCHIVE_AFTER_HOURS: 24
    command: python -m agents.archival.agent


# --- VOLUMES ---
volumes:
  mongo_data:
  minio_data: